apiVersion: v1
kind: Service
metadata:
  name: hivegate
  labels:
    app: hivegate
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: hivegate
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivegate-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - hivegate.example.com
      secretName: hivegate-tls
  rules:
    - host: hivegate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hivegate
                port:
                  number: 80
