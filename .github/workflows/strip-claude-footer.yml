name: Strip Claude Code footer

# The maintainer's contributor-care routine runs in a Claude Code cloud sandbox
# that appends "---\n_Generated by [Claude Code](...)_" to every comment it posts
# or edits, under the maintainer's account. This removes that footer.
#
# Only the maintainer's own comments are touched. The comment body is read from
# the event file with jq, never interpolated into the script, so its text cannot
# inject shell.

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    name: Strip footer
    if: >-
      github.repository == 'hivegate-ai/hivegate' &&
      github.event.comment.user.login == 'liberzon' &&
      contains(github.event.comment.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the footer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          jq -r '.comment.body' "$GITHUB_EVENT_PATH" > body.md
          python3 - <<'EOF'
          import re
          text = open("body.md", encoding="utf-8").read()
          footer = re.compile(
              r"\s*\n-{3,}\s*\n\s*_?(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?\s*\Z"
          )
          cleaned = footer.sub("", text).rstrip()
          if cleaned == text.rstrip():
              print("Footer is not at the end of the comment; leaving it as is")
          else:
              open("clean.md", "w", encoding="utf-8").write(cleaned + "\n")
          EOF
          [ -f clean.md ] || exit 0
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@clean.md --silent
          echo "Removed the footer from comment $COMMENT_ID"
