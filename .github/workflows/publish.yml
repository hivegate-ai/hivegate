name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing, so no API token is stored here

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the release tag

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build --python 3.12

      - name: Check the wheel installs and runs
        run: ./scripts/check_wheel.sh

      - name: Publish
        run: uv publish --trusted-publishing always
