version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pydantic 2.12.x hard-pins pydantic-core==2.41.5, so bumping
      # pydantic-core in isolation causes pip resolution to fail.
      # Remove this rule once pydantic releases a version pinning a
      # newer pydantic-core.
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # google-genai 2.25 caps websockets<17, so a websockets major bump
      # cannot resolve. Remove once google-genai allows websockets 17.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # qdrant-client 1.19 caps portalocker<4, so a portalocker major bump
      # cannot resolve. Remove once qdrant-client allows portalocker 4.
      - dependency-name: "portalocker"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"