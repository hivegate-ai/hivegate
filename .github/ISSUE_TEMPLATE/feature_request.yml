name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, [Discussions → Ideas](https://github.com/hivegate-ai/hivegate/discussions/categories/ideas) is a good place to start.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The change you'd like, and any alternatives you've considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
