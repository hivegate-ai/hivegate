[project]
name = "hivegate"
dynamic = ["version"]
description = "Run your Agno agents as a production API: per-user sessions and OAuth tokens, human approval, teams, versioned prompts."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HiveGate contributors" }]
keywords = ["agno", "ai-agents", "agent-runtime", "fastapi", "mcp", "multi-agent", "human-in-the-loop", "oauth", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "agno[mcp]>=3.1.2",
  "fastapi[standard]",
  "google-genai>=2.29.0",
  "google-cloud-storage",
  "pgvector",
  "psycopg[binary]",
  "sqlalchemy[asyncio]",
  "logtail-python>=0.2.6",
  "types-requests",
  "cachetools>=7.2.1",
  "types-cachetools",
  "qdrant-client>=1.9.0",
  "pypdf>=6.20.0",
  # Security constraints for transitive dependencies
  "starlette>=1.3.1",
  "urllib3>=2.6.3",
  "pyasn1>=0.6.2",
  "h2>=4.3.0",
  "python-docx==1.2.0",
  "aiofiles>=25.1.0",
  "beautifulsoup4==4.15.0",
  "cryptography>=50.0.2",
  "httpx>=0.24.0",
  "pyyaml>=6.0",
  "dateparser",
  "types-dateparser",
  "openai>=3.28.0",
  "anthropic>=1.13.0",
  "Pillow>=12.2.0",
  "prompt-toolkit>=3.0.43",
  # Observability - OpenTelemetry (CNCF standard)
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.62b0",
  "opentelemetry-instrumentation-httpx>=0.62b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.62b0",
  # Observability - Sentry (backward compatibility)
  "sentry-sdk>=2.71.0",
  "mcp>=2.3.0",
  "msgpack>=1.2.3",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "tenacity>=8.0.0",
]

[project.scripts]
hivegate = "hivegate_cli.main:main"

[project.urls]
Homepage = "https://hivegate.dev/?utm_source=pypi"
Documentation = "https://hivegate.dev/docs/?utm_source=pypi"
Repository = "https://github.com/hivegate-ai/hivegate"
Issues = "https://github.com/hivegate-ai/hivegate/issues"
Changelog = "https://github.com/hivegate-ai/hivegate/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = ["mypy", "ruff", "types-requests", "types-cachetools"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "coverage", "testcontainers", "requests"]
langsmith = ["langsmith>=0.14.3", "langchain-core>=1.6.6"]
# Container workers for the supervisor
docker = ["docker>=7.0.0"]
kubernetes = ["kubernetes>=28.0.0"]

[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Named, not discovered: the repo's top-level modal/ would shadow the real modal library,
# and tests/, evals/ and tools_apps/ are not part of the server.
include = [
  "agents*",
  "api*",
  "cache*",
  "db*",
  "dynamic_kb*",
  "hivegate_cli*",
  "prompts*",
  "remote_agent*",
  "supervisor*",
  "toolkits*",
  "workspace_suite*",
]

[tool.setuptools.package-data]
hivegate_cli = ["templates/**/*"]
db = ["migrations/*.sql"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.2.1"

[tool.ruff]
line-length = 120
exclude = [".venv*"]
[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*", "cli/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "setuptools.*", "nest_asyncio.*", "agno.*", "logtail.*", "qdrant_client.*", "opentelemetry.*", "sentry_sdk.*", "InquirerPy", "InquirerPy.*", "docker.*", "kubernetes.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=api",
    "--cov=agents",
    "--cov=db",
    "--cov=dynamic_kb",
    "--cov=workspace_suite",
    "--cov=supervisor",
    "--cov=remote_agent",
    "--cov=toolkits",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["api", "agents", "db", "dynamic_kb", "workspace_suite", "prompts", "supervisor", "remote_agent", "toolkits"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/scripts/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.uv.pip]
no-annotate = true
